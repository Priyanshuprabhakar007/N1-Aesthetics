<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="gynTitle">
  <title id="gynTitle">Gynecomastia Correction — Illustrative Concept</title>
  <defs>
    <linearGradient id="bgGyn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A503E"/>
      <stop offset="55%" stop-color="#3E2E24"/>
      <stop offset="100%" stop-color="#211A17"/>
    </linearGradient>
    <linearGradient id="torsoSkin" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#E2BA98"/>
      <stop offset="50%" stop-color="#BA8E6B"/>
      <stop offset="100%" stop-color="#6E4E38"/>
    </linearGradient>
    <linearGradient id="scrimGyn" x1="0" y1="0.45" x2="0" y2="1">
      <stop offset="0%" stop-color="#211A17" stop-opacity="0"/>
      <stop offset="100%" stop-color="#211A17" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="600" height="720" fill="url(#bgGyn)"/>
  <!-- Athletic sculpted male torso silhouette -->
  <path d="M235 90 L365 90 C385 135, 455 155, 515 185 C535 265, 520 420, 465 690 L135 690 C80 420, 65 265, 85 185 C145 155, 215 135, 235 90 Z" fill="url(#torsoSkin)"/>
  <!-- Defined pectoral contour lines -->
  <path d="M135 285 C175 345, 255 352, 294 315" fill="none" stroke="#6E4B35" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <path d="M465 285 C425 345, 345 352, 306 315" fill="none" stroke="#6E4B35" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <line x1="300" y1="190" x2="300" y2="560" stroke="#7A553D" stroke-width="2.5" opacity="0.55"/>
  <!-- Proportional contour guide lines -->
  <path d="M150 265 Q225 325 292 295" fill="none" stroke="#E6CDB5" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.55"/>
  <path d="M450 265 Q375 325 308 295" fill="none" stroke="#E6CDB5" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.55"/>
  <rect width="600" height="720" fill="url(#scrimGyn)"/>
</svg>
