<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="bcTitle">
  <title id="bcTitle">Body Contouring — Illustrative Concept</title>
  <defs>
    <linearGradient id="bgBc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#765B48"/>
      <stop offset="55%" stop-color="#423127"/>
      <stop offset="100%" stop-color="#211A17"/>
    </linearGradient>
    <linearGradient id="waistSkin" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#EED0B5"/>
      <stop offset="55%" stop-color="#C89E7C"/>
      <stop offset="100%" stop-color="#7B573E"/>
    </linearGradient>
    <linearGradient id="scrimBc" x1="0" y1="0.45" x2="0" y2="1">
      <stop offset="0%" stop-color="#211A17" stop-opacity="0"/>
      <stop offset="100%" stop-color="#211A17" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="600" height="720" fill="url(#bgBc)"/>
  <!-- Harmonious waist & hip silhouette -->
  <path d="M165 95 C185 210, 215 285, 205 355 C192 435, 130 515, 125 690 L475 690 C470 515, 408 435, 395 355 C385 285, 415 210, 435 95 Z" fill="url(#waistSkin)"/>
  <!-- Linen drape lower garment -->
  <path d="M142 485 Q300 545 458 485 L472 655 Q300 605 128 655 Z" fill="#F5EEE8" opacity="0.92"/>
  <!-- Subtle midline & waist contour guides -->
  <line x1="300" y1="160" x2="300" y2="455" stroke="#8C6449" stroke-width="2" opacity="0.45"/>
  <ellipse cx="300" cy="395" rx="4" ry="7" fill="#7B563D" opacity="0.7"/>
  <path d="M180 235 Q235 340 165 445" fill="none" stroke="#E6CDB5" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.65"/>
  <path d="M420 235 Q365 340 435 445" fill="none" stroke="#E6CDB5" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.65"/>
  <rect width="600" height="720" fill="url(#scrimBc)"/>
</svg>
